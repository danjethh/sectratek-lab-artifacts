name: selftests

on:
  push:
  pull_request:

jobs:
  selftests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Structure and hygiene check
        run: python tools/check_packages.py
      - name: Package self-tests
        run: python tools/run_selftests.py
