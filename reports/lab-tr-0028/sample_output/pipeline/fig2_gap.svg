<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 134" width="680" height="268" role="img">
<title>Days from the first boot record to user setup</title><desc>One bar per device, sorted by the number of days from W to U. Values: 0.5, 2.0, 30.0, 60.0, 100.0, 120.0, 200.0, 400.0.</desc>
<rect width="340" height="134" fill="#ffffff"/>
<line x1="40.0" y1="110.0" x2="330.0" y2="110.0" stroke="#1b1b1b" stroke-width="1.0"/>
<line x1="40.0" y1="14.0" x2="40.0" y2="110.0" stroke="#1b1b1b" stroke-width="1.0"/>
<line x1="40.0" y1="110.0" x2="330.0" y2="110.0" stroke="#dddddd" stroke-width="0.4"/>
<text x="37.0" y="113.0" text-anchor="end" fill="#6b6b6b" font-weight="normal" style="font-family:sans-serif;font-size:9px">0</text>
<line x1="40.0" y1="62.0" x2="330.0" y2="62.0" stroke="#dddddd" stroke-width="0.4"/>
<text x="37.0" y="65.0" text-anchor="end" fill="#6b6b6b" font-weight="normal" style="font-family:sans-serif;font-size:9px">200</text>
<line x1="40.0" y1="14.0" x2="330.0" y2="14.0" stroke="#dddddd" stroke-width="0.4"/>
<text x="37.0" y="17.0" text-anchor="end" fill="#6b6b6b" font-weight="normal" style="font-family:sans-serif;font-size:9px">400</text>
<rect x="41.0" y="109.9" width="34.2" height="0.1" fill="#1f5fbf"/>
<rect x="77.2" y="109.5" width="34.2" height="0.5" fill="#1f5fbf"/>
<rect x="113.5" y="102.8" width="34.2" height="7.2" fill="#1f5fbf"/>
<rect x="149.8" y="95.6" width="34.2" height="14.4" fill="#1f5fbf"/>
<rect x="186.0" y="86.0" width="34.2" height="24.0" fill="#1f5fbf"/>
<rect x="222.2" y="81.2" width="34.2" height="28.8" fill="#1f5fbf"/>
<rect x="258.5" y="62.0" width="34.2" height="48.0" fill="#1f5fbf"/>
<rect x="294.8" y="14.0" width="34.2" height="96.0" fill="#1f5fbf"/>
<text x="185.0" y="128.0" text-anchor="middle" fill="#6b6b6b" font-weight="normal" style="font-family:sans-serif;font-size:9px">devices, sorted by days from W to U</text>
<text x="2.0" y="10.0" text-anchor="start" fill="#1b1b1b" font-weight="normal" style="font-family:sans-serif;font-size:9px">days</text>
</svg>
