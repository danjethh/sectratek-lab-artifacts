<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" width="680" role="img" aria-labelledby="f1-t f1-d"><style>text{font:8px sans-serif;fill:#1a1a1a}.m{fill:#555}.mid{text-anchor:middle}.end{text-anchor:end}.b{font-weight:bold}.grid{stroke:#ddd;stroke-width:.6}.ink{stroke:#222;fill:none;stroke-width:.8}.box{fill:#cfe3f5;stroke:#222;stroke-width:.8}.med{stroke:#c33;stroke-width:1.6}.lim{stroke:#c60;fill:none;stroke-width:1}.bar{fill:#2a6fb0}.dash{stroke-dasharray:3 2;stroke:#222;stroke-width:.6}.panel{fill:#f4f4f4;stroke:#555;stroke-width:.8}.panela{fill:#fbe9d0;stroke:#555;stroke-width:.8}.arrow{stroke:#222;fill:none;stroke-width:.9}.head{fill:#222}</style><title id="f1-t">Measurement pipeline</title><desc id="f1-d">Five steps. 1 Read the archive central directory and keep only the members of the fixed store list. 2 Date each store by its own field. 3 Take the acquisition time from the extraction record, or the container file time. 4 Clock rule: keep a device only if its newest record lies between 72 hours before and 1 hour after acquisition. 5 Horizon per store and device, then cells of at least five devices.</desc><rect width="100%" height="100%" fill="#fff"/><rect class="panel" x="8" y="12" width="98" height="44" rx="3"/><text class="mid b" x="57" y="27">1 Archive index</text><text class="mid" x="57" y="39">read-only scan,</text><text class="mid" x="57" y="51">fixed store list</text><rect class="panel" x="121" y="12" width="98" height="44" rx="3"/><text class="mid b" x="170" y="27">2 Date each store</text><text class="mid" x="170" y="39">header, file name</text><text class="mid" x="170" y="51">or SQL column</text><rect class="panel" x="234" y="12" width="98" height="44" rx="3"/><text class="mid b" x="283" y="27">3 Acquisition time</text><text class="mid" x="283" y="39">extraction record</text><text class="mid" x="283" y="51">or container time</text><rect class="panela" x="62" y="92" width="98" height="48" rx="3"/><text class="mid b" x="111" y="107">4 Clock rule</text><text class="mid" x="111" y="119">newest record in</text><text class="mid" x="111" y="131">[-72 h, +1 h]</text><rect class="panel" x="178" y="92" width="98" height="48" rx="3"/><text class="mid b" x="227" y="107">5 Horizon and cells</text><text class="mid" x="227" y="119">n &gt;= 5 devices,</text><text class="mid" x="227" y="131">intervals</text><line class="arrow" x1="106" y1="34" x2="116" y2="34"/><line class="arrow" x1="219" y1="34" x2="229" y2="34"/><line class="arrow" x1="160" y1="116" x2="173" y2="116"/><path class="arrow" d="M 283 56 L 283 74 L 111 74 L 111 86"/><path class="head" d="M 121 34 L 115 31 L 115 37 Z"/><path class="head" d="M 234 34 L 228 31 L 228 37 Z"/><path class="head" d="M 178 116 L 172 113 L 172 119 Z"/><path class="head" d="M 111 92 L 108 86 L 114 86 Z"/></svg>