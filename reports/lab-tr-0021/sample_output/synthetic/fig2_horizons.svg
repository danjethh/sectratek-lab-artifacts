ery hist. (vendor): n 10, median 25.6, quartiles 19.3 to 38.4, range 8.3 to 53.0 days; Android Network stats: n 10, median 94.5, quartiles 88.2 to 101, range 81.3 to 105 days; source limit 90 days; Android Usage stats, any: n 10, median 504, quartiles 333 to 635, range 245 to 689 days; Bug report Event log: n 6, median 0.06, quartiles 0.03 to 0.10, range 0.02 to 0.11 days; Bug report System log: n 6, median 0.05, quartiles 0.04 to 0.08, range 0.02 to 0.12 days.</desc><rect width="100%" height="100%" fill="#fff"/><rect class="box" x="120" y="6" width="14" height="7"/><line class="med" x1="127" y1="5" x2="127" y2="14"/><text x="138" y="13">quartiles, median</text><line class="ink" x1="232" y1="9.5" x2="246" y2="9.5"/><text x="249" y="13">range</text><path class="lim" d="M 289 5.5 L 293 9.5 L 289 13.5 L 285 9.5 Z"/><text x="296" y="13">limit</text><line class="grid" x1="146.0" y1="32" x2="146.0" y2="281"/><text class="m mid" x="146.0" y="292">0.01</text><line class="grid" x1="180.8" y1="32" x2="180.8" y2="281"/><text class="m mid" x="180.8" y="292">0.1</text><line class="grid" x1="215.6" y1="32" x2="215.6" y2="281"/><text class="m mid" x="215.6" y="292">1</text><line class="grid" x1="250.4" y1="32" x2="250.4" y2="281"/><text class="m mid" x="250.4" y="292">10</text><line class="grid" x1="285.2" y1="32" x2="285.2" y2="281"/><text class="m mid" x="285.2" y="292">100</text><line class="grid" x1="320.0" y1="32" x2="320.0" y2="281"/><text class="m mid" x="320.0" y="292">1,000</text><line class="dash" x1="245.0" y1="32" x2="245.0" y2="281"/><text class="m mid" x="245.0" y="30">7 d</text><line class="dash" x1="267.0" y1="32" x2="267.0" y2="281"/><text class="m mid" x="267.0" y="30">30 d</text><text class="m mid" x="233" y="305">days before acquisition (log scale)</text><text class="b" x="4" y="36.5">iOS</text><text x="10" y="48.0">Unified log, Persist</text><text class="m end" x="143" y="48.0">14</text><line class="ink" x1="220.2" y1="44.5" x2="250.1" y2="44.5"/><rect class="